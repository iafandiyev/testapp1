name: Build Simple Notes IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS archive
        run: |
          xcodebuild \
            -project SimpleNotes.xcodeproj \
            -scheme SimpleNotes \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SimpleNotes.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/SimpleNotes.xcarchive/Products/Applications/SimpleNotes.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload SimpleNotes.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNotes-IPA
          path: SimpleNotes.ipa
          if-no-files-found: error
          retention-days: 14