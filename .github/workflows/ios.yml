
name: Build Simple Notes IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iPhone
        run: |
          xcodebuild \
            -project SimpleNotes.xcodeproj \
            -scheme SimpleNotes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/SimpleNotes.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Built app not found"
            find build -name "*.app"
            exit 1
          fi

          rm -rf Payload SimpleNotes.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/SimpleNotes.app

          /usr/bin/ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload SimpleNotes.ipa

          test -s SimpleNotes.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleNotes-IPA
          path: SimpleNotes.ipa
          if-no-files-found: error
          retention-days: 14
